apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def resolveHermesCommandPath = {
    def rnNodeModulesDir = file("../../node_modules")
    def osBin = org.apache.tools.ant.taskdefs.condition.Os.isFamily(org.apache.tools.ant.taskdefs.condition.Os.FAMILY_MAC)
        ? "osx-bin"
        : (org.apache.tools.ant.taskdefs.condition.Os.isFamily(org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS)
            ? "win64-bin"
            : "linux64-bin")
    def hermesBinaryName = org.apache.tools.ant.taskdefs.condition.Os.isFamily(org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS)
        ? "hermesc.exe"
        : "hermesc"

    def directBinary = new File(rnNodeModulesDir, "hermes-compiler/hermesc/${osBin}/${hermesBinaryName}")
    if (directBinary.exists()) {
        return directBinary.absolutePath
    }

    def pnpmStoreDir = new File(rnNodeModulesDir, ".pnpm")
    if (pnpmStoreDir.exists()) {
        def pnpmEntries = pnpmStoreDir.listFiles()
            ?.findAll { it.name.startsWith("hermes-compiler@") }
            ?.sort { a, b -> a.name <=> b.name }
        if (pnpmEntries != null && !pnpmEntries.isEmpty()) {
            def pnpmBinary = new File(
                pnpmEntries.last(),
                "node_modules/hermes-compiler/hermesc/${osBin}/${hermesBinaryName}"
            )
            if (pnpmBinary.exists()) {
                return pnpmBinary.absolutePath
            }
        }
    }

    return ""
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    hermesCommand = resolveHermesCommandPath()
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false
def appVersionCode = 84
def appVersionName = "2.0.0"

def normalizeRuntimeConfigValue = { String value ->
    if (value == null) {
        return null
    }

    def trimmed = value.trim()
    if (trimmed.equalsIgnoreCase("null")) {
        return ""
    }
    if (trimmed.length() >= 2) {
        def hasMatchingSingleQuotes = trimmed.startsWith("'") && trimmed.endsWith("'")
        def hasMatchingDoubleQuotes = trimmed.startsWith("\"") && trimmed.endsWith("\"")
        if (hasMatchingSingleQuotes || hasMatchingDoubleQuotes) {
            return trimmed.substring(1, trimmed.length() - 1).trim()
        }
    }

    return trimmed
}

def readEnvOrDefault = { String key, String fallback ->
    def value = normalizeRuntimeConfigValue(System.getenv(key))
    if (value == null) {
        return fallback
    }
    return value.isEmpty() ? fallback : value
}

def readEnvOrPropertyOrDefault = { String envKey, Properties properties, List<String> propertyKeys, String fallback ->
    def envValue = normalizeRuntimeConfigValue(System.getenv(envKey))
    if (envValue != null) {
        if (!envValue.isEmpty()) {
            return envValue
        }
    }

    for (propertyKey in propertyKeys) {
        def propertyValue = normalizeRuntimeConfigValue(properties.getProperty(propertyKey))
        if (propertyValue != null) {
            if (!propertyValue.isEmpty()) {
                return propertyValue
            }
        }
    }

    return fallback
}

def loadOptionalProperties = { File propertiesFile ->
    def properties = new Properties()
    if (!propertiesFile.exists()) {
        return properties
    }

    propertiesFile.withInputStream { stream ->
        properties.load(stream)
    }
    return properties
}

def repoRootDir = new File(rootProject.projectDir, "../../../").canonicalFile
def findMainWorktreeRoot = {
    try {
        def process = new ProcessBuilder("git", "-C", repoRootDir.absolutePath, "worktree", "list", "--porcelain")
            .redirectErrorStream(true)
            .start()
        def output = process.inputStream.getText("UTF-8")
        if (process.waitFor() != 0) {
            return null
        }

        def worktreePath = null
        for (line in output.readLines()) {
            if (line.startsWith("worktree ")) {
                worktreePath = line.substring("worktree ".length()).trim()
            } else if (line == "branch refs/heads/main" && worktreePath != null) {
                return new File(worktreePath).canonicalFile
            }
        }
    } catch (Exception ignored) {
        // Gradle should still work when git is unavailable.
    }
    return null
}

