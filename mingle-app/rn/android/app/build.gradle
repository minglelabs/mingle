apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def resolveHermesCommandPath = {
    def rnNodeModulesDir = file("../../node_modules")
    def osBin = org.apache.tools.ant.taskdefs.condition.Os.isFamily(org.apache.tools.ant.taskdefs.condition.Os.FAMILY_MAC)
        ? "osx-bin"
        : (org.apache.tools.ant.taskdefs.condition.Os.isFamily(org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS)
            ? "win64-bin"
            : "linux64-bin")
    def hermesBinaryName = org.apache.tools.ant.taskdefs.condition.Os.isFamily(org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS)
        ? "hermesc.exe"
        : "hermesc"

    def directBinary = new File(rnNodeModulesDir, "hermes-compiler/hermesc/${osBin}/${hermesBinaryName}")
    if (directBinary.exists()) {
        return directBinary.absolutePath
    }

    def pnpmStoreDir = new File(rnNodeModulesDir, ".pnpm")
    if (pnpmStoreDir.exists()) {
        def pnpmEntries = pnpmStoreDir.listFiles()
            ?.findAll { it.name.startsWith("hermes-compiler@") }
            ?.sort { a, b -> a.name <=> b.name }
        if (pnpmEntries != null && !pnpmEntries.isEmpty()) {
            def pnpmBinary = new File(
                pnpmEntries.last(),
                "node_modules/hermes-compiler/hermesc/${osBin}/${hermesBinaryName}"
            )
            if (pnpmBinary.exists()) {
                return pnpmBinary.absolutePath
            }
        }
    }

    return ""
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    hermesCommand = resolveHermesCommandPath()
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false
def appVersionCode = 28
def appVersionName = "1.0.6"

def readEnvOrDefault = { String key, String fallback ->
    def value = System.getenv(key)
    if (value == null) {
        return fallback
    }
    def trimmed = value.trim()
    return trimmed.isEmpty() ? fallback : trimmed
}

def readEnvOrPropertyOrDefault = { String envKey, Properties properties, List<String> propertyKeys, String fallback ->
    def envValue = System.getenv(envKey)
    if (envValue != null) {
        def trimmedEnvValue = envValue.trim()
        if (!trimmedEnvValue.isEmpty()) {
            return trimmedEnvValue
        }
    }

    for (propertyKey in propertyKeys) {
        def propertyValue = properties.getProperty(propertyKey)
        if (propertyValue != null) {
            def trimmedPropertyValue = propertyValue.trim()
            if (!trimmedPropertyValue.isEmpty()) {
                return trimmedPropertyValue
            }
        }
    }

    return fallback
}

def loadOptionalProperties = { File propertiesFile ->
    def properties = new Properties()
    if (!propertiesFile.exists()) {
        return properties
    }

    propertiesFile.withInputStream { stream ->
        properties.load(stream)
    }
    return properties
}

def repoDevboxEnvProperties = loadOptionalProperties(new File(rootProject.projectDir, "../../../.devbox.env"))

def readSigningValue = { List<Properties> propertySources, String envKey, String propertyKey ->
    def value = System.getenv(envKey)
    if (value != null) {
        def trimmed = value.trim()
        if (!trimmed.isEmpty()) {
            return trimmed
        }
    }

    for (properties in propertySources) {
        def propertyValue = properties.getProperty(propertyKey)
        if (propertyValue != null) {
            def trimmedPropertyValue = propertyValue.trim()
            if (!trimmedPropertyValue.isEmpty()) {
                return trimmedPropertyValue
            }
        }
    }
    return ""
}

def resolveSigningStoreFile = { String rawPath ->
    if (rawPath == null) {
        return null
    }

    def trimmed = rawPath.trim()
    if (trimmed.isEmpty()) {
        return null
    }

    def direct = file(trimmed)
    if (direct.exists() || new File(trimmed).isAbsolute()) {
        return direct
    }

    def repoRootCandidate = new File(rootProject.projectDir, "../../../${trimmed}")
    if (repoRootCandidate.exists()) {
        return repoRootCandidate
    }

    return rootProject.file(trimmed)
}

def quoteBuildConfigString = { String value ->
    def escaped = value
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
    return "\"${escaped}\""
}

def runtimeSiteUrl = readEnvOrPropertyOrDefault("NEXT_PUBLIC_SITE_URL", repoDevboxEnvProperties, ["NEXT_PUBLIC_SITE_URL", "DEVBOX_SITE_URL"], "https://mingle-app-xi.vercel.app")
def runtimeWsUrl = readEnvOrPropertyOrDefault("NEXT_PUBLIC_WS_URL", repoDevboxEnvProperties, ["NEXT_PUBLIC_WS_URL", "DEVBOX_RN_WS_URL"], "wss://mingle.up.railway.app")
def runtimeApiNamespace = readEnvOrPropertyOrDefault("NEXT_PUBLIC_API_NAMESPACE", repoDevboxEnvProperties, ["RN_ANDROID_API_NAMESPACE"], "android/v1.0.6")
def runtimeClientVersion = readEnvOrDefault("RN_CLIENT_VERSION", appVersionName)
def runtimeClientBuild = readEnvOrDefault("RN_CLIENT_BUILD", String.valueOf(appVersionCode))
def runtimeAdBannerPosition = readEnvOrPropertyOrDefault("RN_AD_BANNER_POSITION", repoDevboxEnvProperties, ["RN_AD_BANNER_POSITION", "NEXT_PUBLIC_RN_AD_BANNER_POSITION"], "off")
def runtimeAdBannerHeightPx = readEnvOrPropertyOrDefault("RN_AD_BANNER_HEIGHT_PX", repoDevboxEnvProperties, ["RN_AD_BANNER_HEIGHT_PX", "NEXT_PUBLIC_RN_AD_BANNER_HEIGHT_PX"], "50")
def runtimeAdmobAppIdAndroid = readEnvOrPropertyOrDefault("RN_ADMOB_APP_ID_ANDROID", repoDevboxEnvProperties, ["RN_ADMOB_APP_ID_ANDROID", "NEXT_PUBLIC_RN_ADMOB_APP_ID_ANDROID"], "")
def runtimeAdmobBannerUnitIdAndroid = readEnvOrPropertyOrDefault("RN_ADMOB_BANNER_UNIT_ID_ANDROID", repoDevboxEnvProperties, ["RN_ADMOB_BANNER_UNIT_ID_ANDROID", "NEXT_PUBLIC_RN_ADMOB_BANNER_UNIT_ID_ANDROID"], "")
def allowCleartextTraffic = runtimeSiteUrl.toLowerCase().startsWith("http://")
def repoCredentialsDir = new File(rootProject.projectDir, "../../../.credentials/android")
def repoAndroidSigningProperties = loadOptionalProperties(new File(repoCredentialsDir, "keystore.properties"))
def localAndroidSigningProperties = loadOptionalProperties(rootProject.file("keystore.properties"))
def uploadStorePath = readSigningValue(
    [repoAndroidSigningProperties, localAndroidSigningProperties],
    "ANDROID_UPLOAD_STORE_FILE",
    "storeFile",
)
def uploadStorePassword = readSigningValue(
    [repoAndroidSigningProperties, localAndroidSigningProperties],
    "ANDROID_UPLOAD_STORE_PASSWORD",
    "storePassword",
)
def uploadKeyAlias = readSigningValue(
    [repoAndroidSigningProperties, localAndroidSigningProperties],
    "ANDROID_UPLOAD_KEY_ALIAS",
    "keyAlias",
)
def uploadKeyPassword = readSigningValue(
    [repoAndroidSigningProperties, localAndroidSigningProperties],
    "ANDROID_UPLOAD_KEY_PASSWORD",
    "keyPassword",
)
def defaultRepoUploadStoreFile = new File(repoCredentialsDir, "mingle-upload.keystore")
def finalUploadStorePath =
    !uploadStorePath.isEmpty()
        ? uploadStorePath
        : (defaultRepoUploadStoreFile.exists() ? defaultRepoUploadStoreFile.absolutePath : "")
def hasUploadSigning =
    !finalUploadStorePath.isEmpty() &&
    !uploadStorePassword.isEmpty() &&
    !uploadKeyAlias.isEmpty() &&
    !uploadKeyPassword.isEmpty()
def uploadStoreFile = hasUploadSigning ? resolveSigningStoreFile(finalUploadStorePath) : null

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.minglelabs.mingle.rn"
    defaultConfig {
        applicationId "com.minglelabs.mingle.rn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        manifestPlaceholders = [
            usesCleartextTraffic: allowCleartextTraffic.toString(),
            adMobApplicationId: runtimeAdmobAppIdAndroid,
        ]
        buildConfigField "String", "MINGLE_WEB_APP_BASE_URL", quoteBuildConfigString(runtimeSiteUrl)
        buildConfigField "String", "MINGLE_DEFAULT_WS_URL", quoteBuildConfigString(runtimeWsUrl)
        buildConfigField "String", "MINGLE_API_NAMESPACE", quoteBuildConfigString(runtimeApiNamespace)
        buildConfigField "String", "MINGLE_CLIENT_VERSION", quoteBuildConfigString(runtimeClientVersion)
        buildConfigField "String", "MINGLE_CLIENT_BUILD", quoteBuildConfigString(runtimeClientBuild)
        buildConfigField "String", "MINGLE_AD_BANNER_POSITION", quoteBuildConfigString(runtimeAdBannerPosition)
        buildConfigField "String", "MINGLE_AD_BANNER_HEIGHT_PX", quoteBuildConfigString(runtimeAdBannerHeightPx)
        buildConfigField "String", "MINGLE_AD_BANNER_UNIT_ID_ANDROID", quoteBuildConfigString(runtimeAdmobBannerUnitIdAndroid)
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadSigning) {
            upload {
                storeFile uploadStoreFile
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Keep local device release installs working when no upload key is configured.
            signingConfig hasUploadSigning ? signingConfigs.upload : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
