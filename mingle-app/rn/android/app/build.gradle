    "DEVBOX_ROOT_DIR",
    "DEVBOX_PROFILE",
    "DEVBOX_WEB_PORT",
    "DEVBOX_STT_PORT",
    "DEVBOX_MESSAGING_PORT",
    "DEVBOX_METRO_PORT",
    "DEVBOX_NGROK_API_PORT",
    "DEVBOX_SITE_URL",
    "DEVBOX_RN_WS_URL",
