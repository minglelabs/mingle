    "DEVBOX_PUBLIC_WS_URL",
    "DEVBOX_PUBLIC_MESSAGING_WS_URL",
    "DEVBOX_TEST_API_BASE_URL",
    "DEVBOX_TEST_WS_URL",
    "NEXT_PUBLIC_SITE_URL",
