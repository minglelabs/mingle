] as Set

def repoDevboxEnvProperties = loadOptionalProperties(new File(rootProject.projectDir, "../../../.devbox.env"))
def repoLocalEnvProperties = loadOptionalProperties(new File(rootProject.projectDir, "../../../mingle-app/.env.local"))
def repoRootEnvProperties = loadOptionalProperties(new File(rootProject.projectDir, "../../../.env.local"))
def mainWorktreeRoot = findMainWorktreeRoot()
def mainRootEnvProperties = mainWorktreeRoot == null
    ? new Properties()
    : loadOptionalProperties(new File(mainWorktreeRoot, ".env.local"))
def repoDevboxWorktreeProperties = new Properties()
repoDevboxEnvProperties.each { key, value ->
    if (worktreePropertyKeys.contains(String.valueOf(key))) {
        repoDevboxWorktreeProperties.setProperty(String.valueOf(key), String.valueOf(value))
    }
}
def repoRuntimeEnvProperties = new Properties()
repoRuntimeEnvProperties.putAll(repoLocalEnvProperties)
repoRuntimeEnvProperties.putAll(repoRootEnvProperties)
repoRuntimeEnvProperties.putAll(mainRootEnvProperties)
repoRuntimeEnvProperties.putAll(repoDevboxWorktreeProperties)

def readSigningValue = { List<Properties> propertySources, String envKey, String propertyKey ->
    def value = normalizeRuntimeConfigValue(System.getenv(envKey))
    if (value != null) {
        if (!value.isEmpty()) {
            return value
        }
    }

    for (properties in propertySources) {
        def propertyValue = normalizeRuntimeConfigValue(properties.getProperty(propertyKey))
        if (propertyValue != null) {
            if (!propertyValue.isEmpty()) {
                return propertyValue
            }
        }
    }
    return ""
}

def resolveSigningStoreFile = { String rawPath ->
    if (rawPath == null) {
        return null
    }

    def trimmed = rawPath.trim()
    if (trimmed.isEmpty()) {
        return null
    }

    def direct = file(trimmed)
    if (direct.exists() || new File(trimmed).isAbsolute()) {
        return direct
    }

    def repoRootCandidate = new File(rootProject.projectDir, "../../../${trimmed}")
    if (repoRootCandidate.exists()) {
        return repoRootCandidate
    }

    return rootProject.file(trimmed)
}

def quoteBuildConfigString = { String value ->
    def escaped = value
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
    return "\"${escaped}\""
}

def runtimeSiteUrl = readEnvOrPropertyOrDefault("NEXT_PUBLIC_SITE_URL", repoRuntimeEnvProperties, ["NEXT_PUBLIC_SITE_URL", "DEVBOX_SITE_URL"], "https://mingle-2-0-0-production.up.railway.app")
def runtimeWsUrl = readEnvOrPropertyOrDefault("NEXT_PUBLIC_WS_URL", repoRuntimeEnvProperties, ["NEXT_PUBLIC_WS_URL", "DEVBOX_RN_WS_URL"], "wss://mingle-2-0-0-production.up.railway.app/stt")
def legacyProductionSiteUrl = readEnvOrPropertyOrDefault("MINGLE_API_FALLBACK_SITE_URL", repoRuntimeEnvProperties, ["DEVBOX_RN_FALLBACK_SITE_URL", "RN_WEB_APP_FALLBACK_BASE_URL", "MINGLE_LEGACY_SITE_URL"], "https://mingle-app-xi.vercel.app")
def legacyProductionWsUrl = readEnvOrPropertyOrDefault("MINGLE_STT_FALLBACK_WS_URL", repoRuntimeEnvProperties, ["DEVBOX_RN_FALLBACK_WS_URL", "RN_DEFAULT_WS_FALLBACK_URL", "MINGLE_LEGACY_WS_URL"], "wss://mingle-stt.fly.dev")
def runtimeApiNamespace = readEnvOrPropertyOrDefault("NEXT_PUBLIC_API_NAMESPACE", repoRuntimeEnvProperties, ["RN_ANDROID_API_NAMESPACE"], "android/v2.0.0")
def runtimeClientVersion = readEnvOrDefault("RN_CLIENT_VERSION", appVersionName)
def runtimeClientBuild = readEnvOrDefault("RN_CLIENT_BUILD", String.valueOf(appVersionCode))
def runtimeAdBannerPosition = readEnvOrPropertyOrDefault("RN_AD_BANNER_POSITION", repoRuntimeEnvProperties, ["RN_AD_BANNER_POSITION", "NEXT_PUBLIC_RN_AD_BANNER_POSITION"], "bottom")
def runtimeAdBannerHeightPx = readEnvOrPropertyOrDefault("RN_AD_BANNER_HEIGHT_PX", repoRuntimeEnvProperties, ["RN_AD_BANNER_HEIGHT_PX", "NEXT_PUBLIC_RN_AD_BANNER_HEIGHT_PX"], "50")
def runtimeAdmobAppIdAndroid = readEnvOrPropertyOrDefault("RN_ADMOB_APP_ID_ANDROID", repoRuntimeEnvProperties, ["RN_ADMOB_APP_ID_ANDROID", "NEXT_PUBLIC_RN_ADMOB_APP_ID_ANDROID"], "ca-app-pub-7057041881494735~1471126891")
def runtimeAdmobBannerUnitIdAndroid = readEnvOrPropertyOrDefault("RN_ADMOB_BANNER_UNIT_ID_ANDROID", repoRuntimeEnvProperties, ["RN_ADMOB_BANNER_UNIT_ID_ANDROID", "NEXT_PUBLIC_RN_ADMOB_BANNER_UNIT_ID_ANDROID"], "ca-app-pub-7057041881494735/6522262692")
def runtimeQaBridgeEnabled = readEnvOrPropertyOrDefault("RN_QA_BRIDGE_ENABLED", repoRuntimeEnvProperties, ["RN_QA_BRIDGE_ENABLED", "NEXT_PUBLIC_RN_QA_BRIDGE_ENABLED"], "0")
def runtimeFirebaseProjectId = readEnvOrPropertyOrDefault("MINGLE_FIREBASE_PROJECT_ID", repoRuntimeEnvProperties, ["MINGLE_FIREBASE_PROJECT_ID"], "")
def runtimeFirebaseApplicationId = readEnvOrPropertyOrDefault("MINGLE_FIREBASE_APPLICATION_ID", repoRuntimeEnvProperties, ["MINGLE_FIREBASE_APPLICATION_ID"], "")
def runtimeFirebaseApiKey = readEnvOrPropertyOrDefault("MINGLE_FIREBASE_API_KEY", repoRuntimeEnvProperties, ["MINGLE_FIREBASE_API_KEY"], "")
def runtimeFirebaseMessagingSenderId = readEnvOrPropertyOrDefault("MINGLE_FIREBASE_MESSAGING_SENDER_ID", repoRuntimeEnvProperties, ["MINGLE_FIREBASE_MESSAGING_SENDER_ID"], "")
if (!(runtimeAdmobAppIdAndroid ==~ /^ca-app-pub-\d+~\d+$/)) {
    throw new GradleException("Invalid RN_ADMOB_APP_ID_ANDROID resolved for Android runtime: ${runtimeAdmobAppIdAndroid}")
}
if (!(runtimeAdmobBannerUnitIdAndroid ==~ /^ca-app-pub-\d+\/\d+$/)) {
    throw new GradleException("Invalid RN_ADMOB_BANNER_UNIT_ID_ANDROID resolved for Android runtime: ${runtimeAdmobBannerUnitIdAndroid}")
}
def allowCleartextTraffic = runtimeSiteUrl.toLowerCase().startsWith("http://")
def repoCredentialsDir = new File(rootProject.projectDir, "../../../.credentials/android")
def repoAndroidSigningProperties = loadOptionalProperties(new File(repoCredentialsDir, "keystore.properties"))
def localAndroidSigningProperties = loadOptionalProperties(rootProject.file("keystore.properties"))
def uploadStorePath = readSigningValue(
    [repoAndroidSigningProperties, localAndroidSigningProperties],
    "ANDROID_UPLOAD_STORE_FILE",
    "storeFile",
)
def uploadStorePassword = readSigningValue(
    [repoAndroidSigningProperties, localAndroidSigningProperties],
    "ANDROID_UPLOAD_STORE_PASSWORD",
    "storePassword",
)
def uploadKeyAlias = readSigningValue(
    [repoAndroidSigningProperties, localAndroidSigningProperties],
    "ANDROID_UPLOAD_KEY_ALIAS",
    "keyAlias",
)
def uploadKeyPassword = readSigningValue(
    [repoAndroidSigningProperties, localAndroidSigningProperties],
    "ANDROID_UPLOAD_KEY_PASSWORD",
    "keyPassword",
)
def defaultRepoUploadStoreFile = new File(repoCredentialsDir, "mingle-upload.keystore")
def finalUploadStorePath =
    !uploadStorePath.isEmpty()
        ? uploadStorePath
        : (defaultRepoUploadStoreFile.exists() ? defaultRepoUploadStoreFile.absolutePath : "")
def hasUploadSigning =
    !finalUploadStorePath.isEmpty() &&
    !uploadStorePassword.isEmpty() &&
    !uploadKeyAlias.isEmpty() &&
    !uploadKeyPassword.isEmpty()
def uploadStoreFile = hasUploadSigning ? resolveSigningStoreFile(finalUploadStorePath) : null

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.minglelabs.mingle.rn"
    defaultConfig {
        applicationId "com.minglelabs.mingle.rn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        manifestPlaceholders = [
            usesCleartextTraffic: allowCleartextTraffic.toString(),
            adMobApplicationId: runtimeAdmobAppIdAndroid,
        ]
        buildConfigField "String", "MINGLE_WEB_APP_BASE_URL", quoteBuildConfigString(runtimeSiteUrl)
        buildConfigField "String", "MINGLE_DEFAULT_WS_URL", quoteBuildConfigString(runtimeWsUrl)
        buildConfigField "String", "MINGLE_LEGACY_WEB_APP_BASE_URL", quoteBuildConfigString(legacyProductionSiteUrl)
        buildConfigField "String", "MINGLE_LEGACY_DEFAULT_WS_URL", quoteBuildConfigString(legacyProductionWsUrl)
        buildConfigField "String", "MINGLE_API_NAMESPACE", quoteBuildConfigString(runtimeApiNamespace)
        buildConfigField "String", "MINGLE_CLIENT_VERSION", quoteBuildConfigString(runtimeClientVersion)
        buildConfigField "String", "MINGLE_CLIENT_BUILD", quoteBuildConfigString(runtimeClientBuild)
        buildConfigField "String", "MINGLE_AD_BANNER_POSITION", quoteBuildConfigString(runtimeAdBannerPosition)
        buildConfigField "String", "MINGLE_AD_BANNER_HEIGHT_PX", quoteBuildConfigString(runtimeAdBannerHeightPx)
        buildConfigField "String", "MINGLE_AD_BANNER_UNIT_ID_ANDROID", quoteBuildConfigString(runtimeAdmobBannerUnitIdAndroid)
        buildConfigField "String", "MINGLE_QA_BRIDGE_ENABLED", quoteBuildConfigString(runtimeQaBridgeEnabled)
        buildConfigField "String", "MINGLE_FIREBASE_PROJECT_ID", quoteBuildConfigString(runtimeFirebaseProjectId)
        buildConfigField "String", "MINGLE_FIREBASE_APPLICATION_ID", quoteBuildConfigString(runtimeFirebaseApplicationId)
        buildConfigField "String", "MINGLE_FIREBASE_API_KEY", quoteBuildConfigString(runtimeFirebaseApiKey)
        buildConfigField "String", "MINGLE_FIREBASE_MESSAGING_SENDER_ID", quoteBuildConfigString(runtimeFirebaseMessagingSenderId)
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadSigning) {
            upload {
                storeFile uploadStoreFile
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Keep local device release installs working when no upload key is configured.
            signingConfig hasUploadSigning ? signingConfigs.upload : signingConfigs.debug
            debuggable runtimeQaBridgeEnabled == "1"
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.google.firebase:firebase-messaging:24.1.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
