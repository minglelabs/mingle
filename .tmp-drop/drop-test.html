<!doctype html><meta charset=utf-8><title>Drop test</title>
<body style="font:16px -apple-system,sans-serif;margin:24px">
<h2>운영툴 사진을 여기로 끌어다 놓으세요</h2>
<div id=drop style="height:260px;border:4px dashed #888;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px">DROP HERE</div>
<pre id=log style="white-space:pre-wrap;background:#f4f4f4;padding:12px;margin-top:16px"></pre>
<script>
const drop=document.getElementById('drop'),log=document.getElementById('log');
drop.addEventListener('dragover',e=>e.preventDefault());
drop.addEventListener('drop',e=>{e.preventDefault();const dt=e.dataTransfer;
const out={types:[...dt.types],files:[...dt.files].map(f=>({name:f.name,type:f.type,size:f.size})),
items:[...dt.items].map(i=>({kind:i.kind,type:i.type})),uri:dt.getData('text/uri-list').slice(0,300),html:dt.getData('text/html').slice(0,300),ua:navigator.userAgent};
log.textContent=JSON.stringify(out,null,1)});
</script>
